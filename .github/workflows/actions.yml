name: run pizza_toni_scraper.py

#on:
#    schedule:
#        - cron: '0 * * * *' #runs every hour

on:
  push:
    branches:
      - develop
  schedule:
  #  - cron: '0 * * * *'
    - cron: '0 9 * * *' #Ogni giorno alle 9 di mattina
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

            - name: checkout repo content
              uses: actions/checkout@v2 #checkout the repository content to github runner
            
            - name: setup python
              uses: actions/setup-python@v4
              with:
                    python-version: '3.9' #install the python version needed
            
            - name: install python packages
              run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
            
            - name: execute py script #run pizza_toni_scraper.py
              env:
                    SOME_SECRET: ${{secrets.SOME_SECRET}}
              run: python pizza_toni_scraper.py

            - name: Commit and push changes
              run: |
                git commit ../old_prices.txt
                if git diff --cached --quiet; then
                  echo "No changes to commit."
                else
                  git commit -m "Aggiornato old_prices da workflow"
                  git push
              env:
                # Serve un token per poter pushare 
                # GITHUB_TOKEN è fornito automaticamente da GitHub Actions
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}